<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="A hidden corner of natestryker.com.">
  <meta name="robots" content="noindex, nofollow">
  <title>Secret Page | natestryker.com</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="secret-page">
  <a class="secret-back secret-home" href="index.html">&larr; Home</a>
  <main class="secret-wrap secret-main">
    <section class="secret-hub secret-login" id="secret-login" aria-label="Password login">
      <form id="secret-form" class="secret-login-form">
        <label for="secret-password">Enter the password</label>
        <input id="secret-password" type="password" autocomplete="current-password" required aria-describedby="secret-error">
        <button class="secret-back" type="submit" aria-label="Unlock page">→</button>
        <p id="secret-error" class="visually-hidden" role="status"></p>
      </form>
    </section>
    <section class="secret-hub" id="secret-content" hidden>
      <h1 tabindex="-1" id="secret-title">how did you find this</h1>
      <div class="secret-clicker">
        <p class="secret-subtitle">Click counter</p>
        <input id="click-count" class="secret-click-count" type="text" inputmode="numeric" aria-label="Click count" value="0" autocomplete="off" spellcheck="false">
        <button id="click-button" class="secret-click-button" type="button">Click me</button>
        <button id="reset-count" class="secret-back" type="button">Reset</button>
        <button id="final-secret" class="secret-back secret-blank-button" type="button" aria-label="Reveal final secret" hidden></button>
      </div>
      <p id="secret-ending" class="secret-ending" role="status" hidden>Congratulations! This is the end of the secrets.</p>
    </section>
  </main>
  <script>
    const form = document.getElementById('secret-form');
    const password = document.getElementById('secret-password');
    const error = document.getElementById('secret-error');
    let clicks = 0;
    const count = document.getElementById('click-count');
    const finalSecret = document.getElementById('final-secret');
    function updateCount() {
      count.value = String(clicks);
      finalSecret.hidden = clicks !== 1543;
    }
    count.addEventListener('focus', () => count.select());
    count.addEventListener('input', () => {
      const value = count.value.trim();
      const number = Number(value);
      if (/^\d+$/.test(value) && Number.isSafeInteger(number)) {
        clicks = number;
        finalSecret.hidden = clicks !== 1543;
      } else {
        finalSecret.hidden = true;
      }
    });
    count.addEventListener('blur', updateCount);
    count.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') count.blur();
    });
    document.getElementById('click-button').addEventListener('click', () => {
      if (clicks < Number.MAX_SAFE_INTEGER) clicks += 1;
      updateCount();
    });
    document.getElementById('reset-count').addEventListener('click', () => {
      clicks = 0;
      updateCount();
    });
    finalSecret.addEventListener('click', () => {
      document.getElementById('secret-ending').hidden = false;
      try {
        sessionStorage.setItem('secret-welcome', 'pending');
      } catch (_) {
        // Carry the surprise home even when browser storage is unavailable.
      }
      document.querySelector('.secret-home').href = 'index.html#secret-welcome';
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const confetti = document.createElement('div');
      confetti.className = 'secret-confetti';
      confetti.setAttribute('aria-hidden', 'true');
      const colors = ['#d6c7ff', '#e36a16', '#67e8d2', '#ffda79', '#f0a4b6'];
      for (let i = 0; i < 100; i += 1) {
        const piece = document.createElement('i');
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * 1.5}s`;
        piece.style.animationDuration = `${2.5 + Math.random() * 2}s`;
        piece.style.setProperty('--drift', `${Math.random() * 160 - 80}px`);
        confetti.appendChild(piece);
      }
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 6500);
    });
    password.addEventListener('input', () => {
      password.removeAttribute('aria-invalid');
      error.textContent = '';
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (password.value !== 'iel0') {
        password.setAttribute('aria-invalid', 'true');
        error.textContent = 'Incorrect password. Try again.';
        password.focus();
        password.select();
        return;
      }
      form.reset();
      document.getElementById('secret-login').hidden = true;
      document.getElementById('secret-content').hidden = false;
      document.getElementById('secret-title').focus();
    });
  </script>
</body>
</html>
