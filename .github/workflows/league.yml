name: League tracker
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['league.html', 'match-history.html', 'assets/league/**', 'scripts/league/**', '.github/workflows/league.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: league-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      collection: ${{ steps.collect.outcome }}
      publication: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/league/*.test.mjs
      - name: Collect Riot data
        id: collect
        continue-on-error: true
        timeout-minutes: 25
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_ACCOUNTS: ${{ vars.RIOT_ACCOUNTS }}
          RIOT_GAME_NAME: ${{ vars.RIOT_GAME_NAME }}
          RIOT_TAG_LINE: ${{ vars.RIOT_TAG_LINE }}
          RIOT_PLATFORM: ${{ vars.RIOT_PLATFORM || 'na1' }}
          RIOT_BACKFILL_PAGES: ${{ vars.RIOT_BACKFILL_PAGES || '2' }}
        run: node scripts/league/collect.mjs
      - name: Build compact frontend from permanent archives
        id: publish
        if: ${{ always() && !cancelled() && steps.collect.outcome != 'skipped' }}
        continue-on-error: true
        env:
          RIOT_ACCOUNTS: ${{ vars.RIOT_ACCOUNTS }}
        run: node scripts/league/publish.mjs
      - name: Persist data even after an interrupted collection
        id: persist
        if: ${{ always() && !cancelled() }}
        run: |
          node scripts/league/archive.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'data/league/**/*.json' 'data/league/*.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Update League match archive and ranked snapshots'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
          fi
      - name: Preserve emergency archive after collection or commit failure
        if: ${{ always() && !cancelled() && (steps.collect.outcome == 'failure' || steps.persist.outcome == 'failure' || steps.publish.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: league-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/league/**/*.json
          retention-days: 30
      - name: Prepare static website
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='_site' --exclude='node_modules' --exclude='/data/league/accounts/*/matches/' --exclude='/data/league/matches/' --exclude='/data/league/accounts/*/state.json' --exclude='/data/league/accounts/*/pending.json' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Collection report
        if: ${{ always() && !cancelled() }}
        env:
          COLLECTION: ${{ steps.collect.outcome }}
          PERSISTENCE: ${{ steps.persist.outcome }}
          PUBLICATION: ${{ steps.publish.outcome }}
        run: |
          echo '## League archive update' >> "$GITHUB_STEP_SUMMARY"
          echo "Collection: $COLLECTION. Frontend build: $PUBLICATION. Repository persistence: $PERSISTENCE." >> "$GITHUB_STEP_SUMMARY"
          echo 'Failed downloads remain in pending.json and are retried. Download a recovery artifact if persistence failed.' >> "$GITHUB_STEP_SUMMARY"
          node scripts/league/report.mjs >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  health:
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail the run when collection or repository persistence failed
        env:
          UPDATE: ${{ needs.update.result }}
          COLLECTION: ${{ needs.update.outputs.collection }}
          PUBLICATION: ${{ needs.update.outputs.publication }}
        run: |
          if [ "$UPDATE" != success ] || [ "$COLLECTION" != success ] || [ "$PUBLICATION" != success ]; then
            echo '::error::League archive update failed or was interrupted. Inspect collection, persistence, pending IDs and recovery artifact. The last successful site remains available.'
            exit 1
          fi
