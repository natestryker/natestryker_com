name: League archive backup
on:
  schedule:
    - cron: '23 8 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: league-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create and verify independent archive snapshot and Git bundle
        env:
          BACKUP_ROOT: ${{ runner.temp }}/league-backup
        run: node scripts/league/backup.mjs create "$BACKUP_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: league-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/league-backup/
          if-no-files-found: error
          retention-days: 90
      - name: Backup report
        run: |
          echo '## League archive backup' >> "$GITHUB_STEP_SUMMARY"
          echo 'Snapshot, SHA-256 manifest and repository history verified. Download this artifact and store it outside GitHub; repository-local artifacts are not protection against repository loss.' >> "$GITHUB_STEP_SUMMARY"
