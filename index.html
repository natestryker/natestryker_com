    </div>
  </footer>
  <script>
    (() => {
      const image = document.getElementById('secret-welcome');
      const fromSecret = location.hash === '#secret-welcome';
      let reward;
      try {
        reward = sessionStorage.getItem('secret-welcome');
      } catch (_) {}
      if (!fromSecret && !reward) return;
      const expires = reward === 'pending' || (fromSecret && !reward)
        ? Date.now() + 30000 : Number(reward);
      const remaining = expires - Date.now();
      try {
        if (remaining > 0) sessionStorage.setItem('secret-welcome', String(expires));
        else sessionStorage.removeItem('secret-welcome');
      } catch (_) {}
      if (fromSecret) history.replaceState(null, '', location.pathname + location.search);
      if (!(remaining > 0)) return;
      image.addEventListener('error', () => { image.hidden = true; });
      image.hidden = false;
      setTimeout(() => {
        image.hidden = true;
        try { sessionStorage.removeItem('secret-welcome'); } catch (_) {}
      }, remaining);
    })();
  </script>
